spring:
  datasource:
    # 접속 정보는 환경변수로 주입한다 (과제 당시 AWS RDS MySQL 사용)
    url: ${DB_URL}  # jdbc:mysql://<rds-endpoint>:3306/todo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
